[package]
name = "senorita-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "1", features = ["shell-open", "notification-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }

[build-dependencies]
tauri-build = { version = "1", features = [] }

