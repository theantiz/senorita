version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: senorita
      POSTGRES_PASSWORD: senorita
      POSTGRES_DB: senorita
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senorita"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

