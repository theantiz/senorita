name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: senorita
          POSTGRES_PASSWORD: senorita
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run tests with pytest
      env:
        DB_HOST: localhost
        DB_PORT: 5433
        POSTGRES_USER: senorita
        POSTGRES_PASSWORD: senorita
      run: |
        cd backend
        pytest tests/ -v --cov=.

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build Export
      run: |
        cd frontend
        npm run build

  docker-compose-test:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Test Docker Compose Build
      run: docker-compose build
